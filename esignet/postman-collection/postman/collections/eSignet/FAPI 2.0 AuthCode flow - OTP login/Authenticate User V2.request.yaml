$kind: http-request
url: "{{url}}/v1/esignet/authorization/v3/authenticate"
method: POST
headers:
  X-XSRF-TOKEN: "{{csrf_token}}"
  oauth-details-key: "{{oauth_details_key}}"
  oauth-details-hash: "{{oauth_details_hash}}"
body:
  type: json
  content: |-
    {
        "requestTime": "{{$isoTimestamp}}",
        "request": {
            "transactionId": "{{transaction_id}}",
            "individualId": "{{individual_id}}",
            "challengeList" : [
                {
                    "authFactorType" : "OTP",
                    "challenge" : "111111",
                    "format" : "alpha-numeric"
                }
            ]
        }
    }
order: 5000
