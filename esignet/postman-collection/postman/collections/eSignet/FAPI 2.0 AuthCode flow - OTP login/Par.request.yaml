$kind: http-request
url: "{{url}}/v1/esignet/oauth/par"
method: POST
body:
  type: urlencoded
  content:
    client_id: "{{client_id}}"
    scope: "{{scope}}"
    response_type: code
    redirect_uri: "{{redirection_url}}"
    display: popup
    prompt: login
    acr_values: mosip:idp:acr:generated-code
    claims: "{{claims}}"
    nonce: "{{$randomPassword}}"
    state: "{{state}}"
    claim_locales: en
    client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
    client_assertion: "{{par_client_assertion}}"
    dpop_jkt: "{{dpop_jkt}}"
    code_challenge: "{{codeChallenge}}"
    code_challenge_method: "{{codeChallengeMethod}}"
scripts:
  - type: beforeRequest
    code: "eval(pm.environment.get('pmlib_code'))\r

      \r

      // Set headers for JWT\r

      var header = {\t\r

      \t\"alg\": \"RS256\"\r

      };\r

      \r

      const private_key_jwk =
      JSON.parse(pm.environment.get(\"client_private_key\"));\r

      \r

      const signed_jwt = pmlib.clientAssertPrivateKey(private_key_jwk,
      pm.environment.get('client_id'), pm.environment.get('par_audience'), exp =
      60,  \"RS256\");\r

      \r

      pm.collectionVariables.set(\"par_client_assertion\",signed_jwt);\r

      \r

      \r

      // dpop\r

      \r

      async function generateJKT(publicKey) {\r

      \    // Create canonical JSON representation for RSA thumbprint\r

      \    // For RSA keys, the required members are: e, kty, n (in
      lexicographic order)\r

      \    const thumbprintInput = JSON.stringify({\r

      \        \"e\": publicKey.e,\r

      \        \"kty\": publicKey.kty,\r

      \        \"n\": publicKey.n\r

      \    });\r

      \r

      \    return pmlib.rs.hextob64u(pmlib.sha256(thumbprintInput));\r

      }\r

      \r

      async function createDPoPProof(privateKey, publicKey) {\r

      \    const now = Math.floor(Date.now() / 1000);\r

      \    const jti = crypto.randomUUID();\r

      \    \r

      \    // JWT Header for RSA-256\r

      \    const header = {\r

      \        \"typ\": \"dpop+jwt\",\r

      \        \"alg\": \"RS256\",\r

      \        \"jwk\": publicKey\r

      \    };\r

      \    \r

      \    // JWT Payload\r

      \    const payload = {\r

      \        \"jti\": jti,\r

      \        \"htm\": pm.request.method.toUpperCase(),\r

      \        \"htu\": `${pm.environment.get(\"url\")}/v1/esignet/oauth/par`,\r

      \        \"iat\": now\r

      \    };\r

      \r

      \    return pmlib.jwtSign(privateKey, payload, header, 60, \"RS256\");\r

      }\r

      \r

      const dpopKeyPair = pmlib.rs.KEYUTIL.generateKeypair(\"RSA\", 2048);\r

      const dpopPrivateKey = pmlib.rs.KEYUTIL.getJWK(dpopKeyPair.prvKeyObj);\r

      const dpopPublicKey = pmlib.rs.KEYUTIL.getJWK(dpopKeyPair.pubKeyObj);\r

      \r

      // Generate JKT for RSA key\r

      const jkt = await generateJKT(dpopPublicKey);\r

      \r

      // Generate DPoP proof with RS256\r

      const dpopProof = await createDPoPProof(dpopPrivateKey, dpopPublicKey);\r

      \r

      pm.request.headers.add({\r

      \    key: \"DPoP\",\r

      \    value: dpopProof\r

      });\r

      pm.environment.set(\"dpop_jkt\", jkt);\r

      \r

      // Store in environment variables\r

      pm.environment.set(\"dpop_private_key\",
      JSON.stringify(dpopPrivateKey));\r

      pm.environment.set(\"dpop_public_key\", JSON.stringify(dpopPublicKey));\r

      \r

      // ---------- PKCE ----------\r

      const pkce = pmlib.pkceChallenge();\r

      pm.collectionVariables.set(\"codeChallenge\", pkce.code_challenge);\r

      pm.collectionVariables.set(\"codeChallengeMethod\",
      pkce.code_challenge_method);\r

      pm.collectionVariables.set(\"codeVerifier\", pkce.code_verifier);\r

      console.log(\"PKCE Generated:\", pkce);"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Check request_uri\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.request_uri).not.equals(null);\r

      \    pm.environment.set(\"request_uri\", jsonData.request_uri);\r

      }); "
    language: text/javascript
order: 2000
