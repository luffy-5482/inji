$kind: http-request
url: "{{url}}/v1/esignet/authorization/par-oauth-details"
method: POST
headers:
  X-XSRF-TOKEN: "{{csrf_token}}"
body:
  type: json
  content: "{\r

    \    \"requestTime\": \"{{$isoTimestamp}}\",\r

    \    \"request\": {\r

    \        \"requestUri\": \"{{request_uri}}\",\r

    \        \"clientId\": \"{{client_id}}\"\r

    \    }\r

    }"
scripts:
  - type: afterResponse
    code: "var btoa = require('btoa');\r

      \r

      pm.test(\"Validate transactionId\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.response.transactionId).not.equals(null);\r

      \    pm.environment.set(\"transaction_id\",
      jsonData.response.transactionId);\r

      });\r

      \r

      pm.test(\"Validate auth factors\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.response.authFactors[0].name).to.eql(pm.environme\
      nt.get(\"expected_amr\"));\r

      });\r

      \r

      pm.test(\"set oauth-details-hash\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    var sha256Hash =
      CryptoJS.SHA256(JSON.stringify(jsonData.response));\r

      \    var base64Encoded = sha256Hash.toString(CryptoJS.enc.Base64);\r

      \    // Remove padding characters\r

      \    base64Encoded = base64Encoded.replace(/=+$/, '');\r

      \    // Replace '+' with '-' and '/' with '_' to convert to base64 URL
      encoding\r

      \    base64Encoded = base64Encoded.replace(/\\+/g, '-').replace(/\\//g,
      '_');\r

      \    console.log(\"base64Encoded : \" + base64Encoded);\r

      \    pm.environment.set(\"oauth_details_key\",
      jsonData.response.transactionId);\r

      \    pm.environment.set(\"oauth_details_hash\", base64Encoded);\r

      });"
    language: text/javascript
order: 3000
