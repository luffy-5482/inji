$kind: http-request
url: "{{url}}/v1/esignet/oauth/v2/token"
method: POST
headers:
  X-XSRF-TOKEN: "{{csrf_token}}"
body:
  type: urlencoded
  content:
    code: "{{code}}"
    client_id: "{{client_id}}"
    redirect_uri: "{{redirection_url}}"
    grant_type: authorization_code
    client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
    client_assertion: "{{client_assertion}}"
    code_verifier: "{{codeVerifier}}"
scripts:
  - type: beforeRequest
    code: >-
      eval(pm.environment.get('pmlib_code'))


      // Set headers for JWT

      var header = {	
      	"alg": "RS256"
      };


      const private_key_jwk =
      JSON.parse(pm.environment.get("client_private_key"));


      const signed_jwt = pmlib.clientAssertPrivateKey(private_key_jwk,
      pm.environment.get('client_id'), pm.environment.get('audience'), exp =
      60,  "RS256");


      pm.collectionVariables.set("client_assertion",signed_jwt);



      // dpop

      async function createDPoPProof(privateKey, publicKey) {
          const now = Math.floor(Date.now() / 1000);
          const jti = crypto.randomUUID();
          
          // JWT Header for RSA-256
          const header = {
              "typ": "dpop+jwt",
              "alg": "RS256",
              "jwk": publicKey
          };
          
          // JWT Payload
          const payload = {
              "jti": jti,
              "htm": pm.request.method.toUpperCase(),
              "htu": `${pm.environment.get("url")}/v1/esignet/oauth/v2/token`,
              "iat": now
          };

          const dpopNonce = pm.environment.get("dpop_nonce") || null;

          if(dpopNonce) {
              payload.nonce = dpopNonce;
          }

          return pmlib.jwtSign(privateKey, payload, header, 60, "RS256");
      }


      const dpopPublicKey = JSON.parse(pm.environment.get("dpop_public_key"));

      const dpopPrivateKey = JSON.parse(pm.environment.get("dpop_private_key"));


      // Generate DPoP proof with RS256

      const dpopProof = await createDPoPProof(dpopPrivateKey, dpopPublicKey);


      pm.request.headers.add({
          key: "DPoP",
          value: dpopProof
      });
    language: text/javascript
  - type: afterResponse
    code: >-
      if (pm.response.code === 400 && pm.response.json().error ===
      "use_dpop_nonce") {
          const nonce = pm.response.headers.get("DPoP-Nonce");
          if (nonce) {
              pm.environment.set("dpop_nonce", nonce);
              console.log("Saved new DPoP-Nonce:", nonce);
          }
      } else if(pm.response.code === 200) {
          // If successful, clear the nonce so next run starts clean
          pm.environment.unset("dpop_nonce");
          console.log("Cleared DPoP-Nonce token");
      }


      pm.test("Validate Id-token", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.id_token).not.equals(null);
      });


      pm.test("Validate access-token", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.access_token).not.equals(null);
          pm.environment.set("access_token", jsonData.access_token);
      });
    language: text/javascript
order: 7000
